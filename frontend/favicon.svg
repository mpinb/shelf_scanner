<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e19"/>
      <stop offset="100%" stop-color="#0f1411"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2b3b30" stroke-width="8"/>

  <!-- Botanical Leaf Background Accent -->
  <path d="M256 80 C360 80 430 170 410 290 C390 410 280 450 256 460 C232 450 122 410 102 290 C82 170 152 80 256 80 Z" fill="rgba(16, 185, 129, 0.08)" />

  <!-- Center Book Spine Motif with Perspective -->
  <g filter="url(#shadow)">
    <!-- Standing Book 1 (Left - Brass Ochre) -->
    <path d="M140 180 L188 160 L188 380 L140 395 Z" fill="url(#spineGrad)" opacity="0.95"/>
    <path d="M140 180 L148 176 L148 391 L140 395 Z" fill="#92400e"/>

    <!-- Standing Book 2 (Center Major - Vibrant Emerald) -->
    <path d="M198 140 L260 125 L260 410 L198 420 Z" fill="url(#emeraldGrad)"/>
    <path d="M198 140 L206 137 L206 417 L198 420 Z" fill="#047857"/>
    <!-- Book 2 Ribbon / Bookmark -->
    <path d="M228 132 L228 200 L238 190 L248 200 L248 128 Z" fill="#fef3c7" opacity="0.9"/>

    <!-- Leaning Book 3 (Right - Forest Green) -->
    <path d="M280 150 L340 190 L295 435 L245 400 Z" fill="#15803d"/>
    <path d="M280 150 L288 155 L253 405 L245 400 Z" fill="#14532d"/>

    <!-- Bottom Bookshelf Ledge -->
    <rect x="90" y="425" width="332" height="20" rx="6" fill="#2d3b32" stroke="#3d4f43" stroke-width="3"/>
  </g>

  <!-- Sprouting Botanical Leaf Accent at Top -->
  <g transform="translate(256, 110) scale(1.3)">
    <path d="M0 0 C12 -24 38 -28 46 -12 C52 2 34 22 0 30 C-34 22 -52 2 -46 -12 C-38 -28 -12 -24 0 0 Z" fill="url(#emeraldGrad)"/>
    <path d="M0 -15 L0 25" stroke="#f2f7f4" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
